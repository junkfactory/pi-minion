name: ci

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    if: "!startsWith(github.ref, 'refs/tags/')"
    strategy:
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./.github/ci/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
